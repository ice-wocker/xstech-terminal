name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
        # 两条腿：装了 OpenCV 的走加速路径，没装的走 numpy 兜底。
        # 之前只测前者，结果「Termux 上没装 cv2 直接 traceback」漏到了用户手里。
        captcha-extra: ["", ".[captcha-cv2]"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e "${{ matrix.captcha-extra }}" -e ".[dev]"
      - name: 语法检查
        run: python -m compileall -q src tests
      - name: 单测
        run: pytest -q
      - name: 冒烟：CLI 可执行且能加载模块
        run: |
          xstech-gateway --version
          xstech-gateway --help

  # 单独一条腿：把 OpenCV「彻底藏掉」再跑注册链路的关键部分，
  # 确保没有 cv2 时不会炸在 import 阶段（这是真出过的故障）。
  test-no-cv2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 只装最小依赖（不含 OpenCV）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 确认环境里真的没有 cv2
        run: |
          python - <<'PY'
          import importlib.util, sys
          assert importlib.util.find_spec("cv2") is None, "这条腿不该装 OpenCV"
          print("cv2 不存在，符合预期")
          PY
      - name: 无 cv2 也要能导入整条注册链路
        run: |
          python - <<'PY'
          import sys
          import builtins
          real = builtins.__import__
          def fake(name, *a, **kw):
              if name == "cv2" or name.startswith("cv2."):
                  raise ImportError("No module named 'cv2'")
              return real(name, *a, **kw)
          builtins.__import__ = fake

          from src import captcha, upstream
          assert captcha.HAS_CV2 is False, "应该探测到没有 cv2"
          assert hasattr(upstream.Upstream, "solve_challenge")
          print("无 cv2 环境下，captcha / upstream 均可正常导入")
          PY
