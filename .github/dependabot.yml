version: 2
updates:
  # 运行依赖很少（requests / pillow / numpy），但正是「少」才该盯：
  # 这三个是仅有的供应链面。
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-deps:
        patterns: ["*"]

  # 盯 CI 里用到的 action 版本。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
