version: 2
updates:
  # 运行依赖很少（requests / pillow / numpy），但正是「少」才该盯：
  # 这三个是仅有的供应链面。
  #
  # （原来还有一条 github-actions 的更新项，CI 删掉之后没有 action 可盯了，
  #   一并去掉。理由见 .github/workflows/README.md。）
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-deps:
        patterns: ["*"]
