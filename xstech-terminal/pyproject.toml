[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xstech-gateway"
version = "0.2.0"
description = "把 xstech.one 的网页端能力包装成 OpenAI 兼容端点，供终端与本地工具使用"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.scripts]
xstech-gateway = "src.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# OpenCV 只用于加速滑块求解里的形态学腐蚀，**不是硬依赖**：
# 不装它时 captcha.py 会退回等价的纯 numpy 实现（见 src/captcha.py 的 _erode）。
# 旧版把 `import cv2` 写在模块顶层，导致没装 cv2 的机器（Termux 默认就没有）
# 连 CLI 都起不来 —— 报的还是裸 ModuleNotFoundError。
captcha-cv2 = ["opencv-python-headless>=4.8"]

# tools/ 也装进去：`make e2e` 和 tests 都要 import 它
[tool.setuptools]
packages = ["src", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
