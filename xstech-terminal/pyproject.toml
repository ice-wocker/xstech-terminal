[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xstech-gateway"
version = "0.1.0"
description = "把 xstech.one 的网页端能力包装成 OpenAI 兼容端点，供终端与本地工具使用"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.scripts]
xstech-gateway = "src.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
